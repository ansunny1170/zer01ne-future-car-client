name: Build & Deploy Frontend

on:
  push:
    branches: [main-2026]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ansunny1170/future-car-frontend  # compose 의 image 이름과 일치

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Mac Studio 는 Tailscale 사설망이라 클라우드 러너가 SSH 로 못 닿음 → 당분간 수동 배포.
      # self-hosted 러너(Mac Studio)를 붙이면 이 if: false 를 제거해 CD 재활성화.
      - name: Deploy to Mac Studio
        if: false
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.MAC_STUDIO_HOST }}
          username: ${{ secrets.MAC_STUDIO_USER }}
          key: ${{ secrets.MAC_STUDIO_SSH_KEY }}
          script: |
            cd ~/Projects/future-car
            docker compose pull future-car-frontend
            docker compose up -d --no-deps future-car-frontend
            docker image prune -f
