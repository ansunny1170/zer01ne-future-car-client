name: Build & Deploy Frontend

# Mac Studio self-hosted 러너에서 실행 → 네이티브 arm64 빌드(빠름) + 로컬 배포(자동).
# 러너가 Mac Studio 안에 있으므로 SSH·ghcr push/pull 불필요.
#
# 같은 소스로 컨테이너 두 개를 갱신한다(2026-08-30):
#   - future-car-frontend      :8101  전시 본체. 브라우저가 Tailscale 로 백엔드(:8100)·MinIO(:9100)에 직접 도달.
#   - future-car-frontend-ext  :8102  외부 열람용. Tailscale 밖 브라우저는 맥스튜디오에 못 가므로
#                                     OCI 프록시(jscouple.site:8080 → /car1 백엔드, /minio MinIO)를 거치는
#                                     주소로 빌드한다. OCI 쪽 /car2 는 이 컨테이너(8102)를 보게 한다.
# NEXT_PUBLIC_* 는 빌드 시점에 번들에 박제되므로 --build-arg 로 주입해야 하고, 그래서 이미지가 둘이다.
on:
  push:
    branches: [main-2026]

env:
  # 외부(OCI 프록시) 경유 주소 — 담당자가 프록시 경로/포트를 바꾸면 여기만 고친다.
  EXT_API_URL: http://jscouple.site:8080/car1
  EXT_S3_BASE: http://jscouple.site:8080/minio/future-car-media
  EXT_PORT: "8102"

jobs:
  build-and-deploy:
    runs-on: [self-hosted, future-car]
    steps:
      - uses: actions/checkout@v4

      - name: Build & deploy on Mac Studio (native arm64)
        run: |
          # 브라우저가 Tailscale 로 백엔드(:8100)에 도달하는 주소를 사용.
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=http://creator-mac-studio.tail69930a.ts.net:8100 \
            --build-arg NEXT_PUBLIC_IS_PRD=false \
            --build-arg NEXT_PUBLIC_S3_BASE=http://creator-mac-studio.tail69930a.ts.net:9100/future-car-media \
            -t ghcr.io/ansunny1170/future-car-frontend:latest .
          cd ~/Projects/future-car
          docker compose up -d --no-deps --force-recreate future-car-frontend

      - name: Build & deploy external (proxy) frontend on :${{ env.EXT_PORT }}
        run: |
          # compose 파일은 Mac Studio 에만 있고 레포에 없으므로 이 컨테이너는 docker run 으로 관리한다.
          docker build \
            --build-arg NEXT_PUBLIC_API_URL="$EXT_API_URL" \
            --build-arg NEXT_PUBLIC_IS_PRD=false \
            --build-arg NEXT_PUBLIC_S3_BASE="$EXT_S3_BASE" \
            -t future-car-frontend-ext:latest .
          docker rm -f future-car-frontend-ext 2>/dev/null || true
          docker run -d --name future-car-frontend-ext --restart unless-stopped \
            -p "$EXT_PORT":3000 future-car-frontend-ext:latest
          # 기동 확인 — 컨테이너 안 Next 가 뜰 때까지 최대 30초
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:$EXT_PORT/ambient" || true)
            [ "$code" = "200" ] && { echo "ext frontend OK (HTTP $code)"; break; }
            sleep 1
          done
          [ "$code" = "200" ] || { echo "::error::ext frontend 가 :$EXT_PORT 에서 200 을 주지 않음 (HTTP $code)"; docker logs --tail 50 future-car-frontend-ext; exit 1; }

      - name: Prune dangling images
        if: always()
        run: docker image prune -f
