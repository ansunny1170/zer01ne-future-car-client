# 개인 레포(ansunny1170/zer01ne-future-car-client) → 조직 미러(zero1ne-26/future-car-client) 자동 복제.
#
# 로컬 remote 의 push URL 두 개(개인+조직)가 1차, 이 워크플로가 2차 안전망이다 —
# 어느 기기에서 개인 레포에만 푸시해도 조직이 따라온다. 조직 레포는 읽기용 미러라
# 거기서 직접 커밋하면 다음 미러에 덮어써진다(--force --prune).
#
# 필요한 secret: ZERONE_ORG_MIRROR_TOKEN — zero1ne-26/future-car-client 에 Contents: Read and write 권한의
# fine-grained PAT(또는 repo 스코프 classic PAT). 없으면 실패로 표시만 되고 원본엔 영향 없다.
name: Mirror to zero1ne-26

on:
  push:
    branches: ['**']
    tags: ['**']
  workflow_dispatch:

# 연속 푸시가 겹쳐도 미러는 한 번에 하나만(순서 꼬임 방지)
concurrency:
  group: mirror-to-org
  cancel-in-progress: false

jobs:
  mirror:
    # 조직 미러 레포에 이 파일이 복제돼도 거기서는 돌지 않게(Actions 도 꺼 두었다)
    if: github.repository_owner == 'ansunny1170'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push all branches and tags to zero1ne-26/future-car-client
        env:
          TOKEN: ${{ secrets.ZERONE_ORG_MIRROR_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::ZERONE_ORG_MIRROR_TOKEN secret 이 없습니다 — 레포 Settings > Secrets 에 추가하세요"
            exit 1
          fi
          # origin/HEAD 는 심볼릭 ref 라 refs/heads/HEAD 로 밀리지 않게 제거
          git update-ref -d refs/remotes/origin/HEAD || true
          git push --force --prune \
            "https://x-access-token:${TOKEN}@github.com/zero1ne-26/future-car-client.git" \
            'refs/remotes/origin/*:refs/heads/*' \
            'refs/tags/*:refs/tags/*'
